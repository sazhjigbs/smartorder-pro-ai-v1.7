<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SmartOrder PRO AI v2.1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
    color: #fff;
    padding: 20px;
}
.container { max-width: 1400px; margin: 0 auto; }
.header {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}
.kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 15px;
}
.kpi {
    background: rgba(255,255,255,0.03);
    padding: 15px;
    border-radius: 8px;
}
.kpi-label { font-size: 12px; color: #aaa; margin-bottom: 5px; }
.kpi-value { font-size: 24px; font-weight: bold; }
.positive { color: #00ff88; }
.negative { color: #ff4444; }
.section {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}
.section-title {
    font-size: 18px;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 10px;
}
.strategy-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.03);
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 10px;
}
.strategy-name { font-weight: bold; }
.toggle {
    width: 50px;
    height: 25px;
    background: #333;
    border-radius: 25px;
    position: relative;
    cursor: pointer;
}
.toggle.active { background: #00ff88; }
.toggle:after {
    content: '';
    position: absolute;
    width: 21px;
    height: 21px;
    background: white;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: 0.3s;
}
.toggle.active:after { left: 27px; }
.emergency {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin: 20px 0;
}
.btn {
    padding: 15px 40px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.btn-stop { background: #ff4444; color: white; }
.btn-pause { background: #ffaa00; color: white; }
.btn-resume { background: #00ff88; color: #0f1419; }
#update { position: fixed; top: 20px; right: 20px; background: rgba(0,170,255,0.2); padding: 10px; border-radius: 8px; font-size: 12px; }
</style>
</head>
<body>
<div id="update">Chargement...</div>
<div class="container">
    <div class="header">
        <h1>🤖 SmartOrder PRO AI v2.1 - Paper Mode REALISTIC</h1>
        <div class="kpis" id="kpis"></div>
    </div>
    
    <div class="emergency">
        <button class="btn btn-stop" onclick="alert('STOP')">🛑 STOP</button>
        <button class="btn btn-pause" onclick="alert('PAUSE')">⏸ PAUSE</button>
        <button class="btn btn-resume" onclick="alert('RESUME')">▶️ RESUME</button>
    </div>
    
    <div class="section">
        <div class="section-title">📊 Stratégies AI (14 total)</div>
        <div id="strategies"></div>
    </div>
</div>

<script>
const API = 'http://' + window.location.hostname + ':5001';

async function load() {
    try {
        const [pnl, wallet, strat] = await Promise.all([
            fetch(API + '/pnl_tracker.json').then(r => r.json()),
            fetch(API + '/paper_wallet.json').then(r => r.json()),
            fetch(API + '/strategies_state.json').then(r => r.json())
        ]);
        
        document.getElementById('kpis').innerHTML = [
            {l: 'Balance', v: wallet.balance_usdt.toFixed(2) + ' USDT'},
            {l: 'PnL', v: (pnl.total_pnl >= 0 ? '+' : '') + pnl.total_pnl.toFixed(2) + ' USDT', c: pnl.total_pnl >= 0 ? 'positive' : 'negative'},
            {l: 'Trades', v: pnl.trades_count},
            {l: 'Win Rate', v: (pnl.win_rate || 0).toFixed(1) + '%'},
            {l: 'Positions', v: wallet.open_positions}
        ].map(k => `<div class="kpi"><div class="kpi-label">${k.l}</div><div class="kpi-value ${k.c || ''}">${k.v}</div></div>`).join('');
        
        const grouped = {
            SPOT: strat.strategies.filter(s => s.type === 'SPOT'),
            FUTURES: strat.strategies.filter(s => s.type === 'FUTURES'),
            HYBRID: strat.strategies.filter(s => s.type === 'HYBRID')
        };
        
        let html = '';
        for (const [type, items] of Object.entries(grouped)) {
            html += `<div style="color:#00aaff;margin:20px 0 10px;font-weight:bold">━━ ${type} (${items.length}) ━━</div>`;
            html += items.map(s => `
                <div class="strategy-item">
                    <div>
                        <div class="strategy-name">${s.enabled ? '✅' : '❌'} ${s.name}</div>
                        <div style="font-size:12px;color:#aaa">${s.type} | Score: ${s.score}</div>
                    </div>
                    <div class="toggle ${s.enabled ? 'active' : ''}" onclick="toggle('${s.id}')"></div>
                </div>
            `).join('');
        }
        document.getElementById('strategies').innerHTML = html;
        document.getElementById('update').textContent = 'Mis à jour: ' + new Date().toLocaleTimeString();
    } catch (e) {
        console.error(e);
    }
}

function toggle(id) {
    alert('Toggle ' + id + ' (Persistance à implémenter)');
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
