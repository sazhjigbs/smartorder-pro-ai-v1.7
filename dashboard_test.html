<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartOrder PRO - TEST Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; }
        .section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 { margin-bottom: 15px; border-bottom: 2px solid #fff; padding-bottom: 10px; }
        .strategies-grid, .exchanges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .card {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .card h3 { margin-bottom: 10px; }
        .status { display: inline-block; padding: 3px 10px; border-radius: 5px; font-size: 12px; }
        .status.active { background: #4CAF50; }
        .status.inactive { background: #f44336; }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #45a049; }
        .error { background: #f44336; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .success { background: #4CAF50; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 SmartOrder PRO - TEST Dashboard</h1>
        
        <div class="section">
            <h2>Mode Selection</h2>
            <button onclick="changeMode('spot')">📊 SPOT</button>
            <button onclick="changeMode('futures')">📈 FUTURES</button>
            <button onclick="changeMode('hybride')">⚡ HYBRIDE</button>
            <button onclick="changeMode('manuel')">🎯 MANUEL</button>
            <p id="current-mode" style="margin-top: 15px;">Current Mode: <strong id="mode-text">Loading...</strong></p>
        </div>

        <div class="section">
            <h2>⚙️ Active Strategies</h2>
            <div id="strategies-container">Loading strategies...</div>
        </div>

        <div class="section">
            <h2>📊 Exchanges</h2>
            <div id="exchanges-container">Loading exchanges...</div>
        </div>

        <div class="section">
            <h2>💰 Funding Rates</h2>
            <div id="funding-container">Loading funding rates...</div>
        </div>

        <div class="section">
            <h2>📈 Open Positions</h2>
            <div id="positions-container">Loading positions...</div>
        </div>

        <div class="section">
            <h2>🔍 API Test Results</h2>
            <button onclick="testAllAPIs()">Test All APIs</button>
            <div id="test-results" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol + '//' + window.location.hostname;
        let currentMode = 'futures';

        async function changeMode(mode) {
            console.log('Changing mode to:', mode);
            try {
                const response = await fetch(`${API_BASE}/api/mode/change`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: mode })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentMode = mode;
                    document.getElementById('mode-text').textContent = mode.toUpperCase();
                    loadStrategies();
                    console.log('Mode changed:', data);
                } else {
                    console.error('Mode change failed:', response.status);
                }
            } catch (error) {
                console.error('Error changing mode:', error);
            }
        }

        async function loadStrategies() {
            console.log('Loading strategies for mode:', currentMode);
            try {
                const response = await fetch(`${API_BASE}/api/strategies?mode=${currentMode}`);
                const data = await response.json();
                console.log('Strategies data:', data);

                const container = document.getElementById('strategies-container');
                
                if (data.strategies && data.strategies.length > 0) {
                    container.innerHTML = `<p>Mode: ${data.mode} | Total Active: ${data.total_active}</p><div class="strategies-grid"></div>`;
                    const grid = container.querySelector('.strategies-grid');
                    
                    data.strategies.forEach(strat => {
                        grid.innerHTML += `
                            <div class="card">
                                <h3>${strat.name}</h3>
                                <p><span class="status ${strat.active ? 'active' : 'inactive'}">${strat.active ? 'ACTIVE' : 'INACTIVE'}</span></p>
                                <p>PnL: $${strat.pnl.toFixed(2)}</p>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p>No strategies available</p>';
                }
            } catch (error) {
                console.error('Error loading strategies:', error);
                document.getElementById('strategies-container').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function loadExchanges() {
            console.log('Loading exchanges...');
            try {
                const response = await fetch(`${API_BASE}/api/exchanges`);
                const data = await response.json();
                console.log('Exchanges data:', data);

                const container = document.getElementById('exchanges-container');
                
                // Handle both array and object formats
                const exchanges = Array.isArray(data) ? data : data.exchanges || [];
                
                if (exchanges.length > 0) {
                    container.innerHTML = '<div class="exchanges-grid"></div>';
                    const grid = container.querySelector('.exchanges-grid');
                    
                    exchanges.forEach(ex => {
                        grid.innerHTML += `
                            <div class="card">
                                <h3>${ex.name}</h3>
                                <p><span class="status ${ex.connected ? 'active' : 'inactive'}">${ex.connected ? 'CONNECTED' : 'DISCONNECTED'}</span></p>
                                <p>Latency: ${ex.latency}ms</p>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p>No exchanges available</p>';
                }
            } catch (error) {
                console.error('Error loading exchanges:', error);
                document.getElementById('exchanges-container').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function loadFundingRates() {
            console.log('Loading funding rates...');
            try {
                const response = await fetch(`${API_BASE}/api/funding/rates`);
                const data = await response.json();
                console.log('Funding data:', data);

                const container = document.getElementById('funding-container');
                
                if (data.rates && data.rates.length > 0) {
                    let html = '<table style="width:100%; color:#fff;"><tr><th>Symbol</th><th>Rate</th><th>Next Funding</th></tr>';
                    data.rates.forEach(rate => {
                        html += `<tr><td>${rate.symbol}</td><td>${(rate.rate * 100).toFixed(4)}%</td><td>${rate.next_funding}</td></tr>`;
                    });
                    html += '</table>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p>No funding rates available</p>';
                }
            } catch (error) {
                console.error('Error loading funding rates:', error);
                document.getElementById('funding-container').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function loadPositions() {
            console.log('Loading positions...');
            try {
                const response = await fetch(`${API_BASE}/api/positions`);
                const data = await response.json();
                console.log('Positions data:', data);

                const container = document.getElementById('positions-container');
                
                if (Array.isArray(data) && data.length > 0) {
                    let html = '<table style="width:100%; color:#fff;"><tr><th>Symbol</th><th>Strategy</th><th>Amount</th><th>PnL</th></tr>';
                    data.forEach(pos => {
                        html += `<tr><td>${pos.symbol}</td><td>${pos.strategy}</td><td>${pos.amount.toFixed(4)}</td><td>$${pos.pnl.toFixed(2)}</td></tr>`;
                    });
                    html += '</table>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p>No open positions</p>';
                }
            } catch (error) {
                console.error('Error loading positions:', error);
                document.getElementById('positions-container').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function testAllAPIs() {
            const results = document.getElementById('test-results');
            results.innerHTML = '<p>Testing APIs...</p>';
            
            const endpoints = [
                '/api/status',
                '/api/strategies?mode=futures',
                '/api/exchanges',
                '/api/funding/rates',
                '/api/positions'
            ];
            
            let html = '';
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(`${API_BASE}${endpoint}`);
                    const data = await response.json();
                    html += `<div class="success">✅ ${endpoint} - OK (${response.status})</div>`;
                } catch (error) {
                    html += `<div class="error">❌ ${endpoint} - FAILED: ${error.message}</div>`;
                }
            }
            
            results.innerHTML = html;
        }

        // Load all data on page load
        window.addEventListener('load', () => {
            console.log('Dashboard loaded. API_BASE:', API_BASE);
            loadStrategies();
            loadExchanges();
            loadFundingRates();
            loadPositions();
            
            // Update mode display
            fetch(`${API_BASE}/api/status`)
                .then(r => r.json())
                .then(data => {
                    currentMode = data.mode || 'futures';
                    document.getElementById('mode-text').textContent = currentMode.toUpperCase();
                });
        });

        // Auto-refresh every 10 seconds
        setInterval(() => {
            loadStrategies();
            loadPositions();
            loadFundingRates();
        }, 10000);
    </script>
</body>
</html>
