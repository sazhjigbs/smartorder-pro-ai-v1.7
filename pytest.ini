[pytest]
# ==============================================================================
# SmartOrder PRO - Pytest Configuration
# ==============================================================================

# Répertoire des tests
testpaths = tests

# Options par défaut
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Patterns de découverte
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personnalisés
markers =
    slow: Tests lents (désactiver avec -m "not slow")
    integration: Tests d'intégration nécessitant APIs
    unit: Tests unitaires rapides
    smoke: Tests de smoke (rapides, critiques)

# Ignore ces dossiers
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    venv
    node_modules

# Coverage
[coverage:run]
source = core,ai_core,executor,web
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
