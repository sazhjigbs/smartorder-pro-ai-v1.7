<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration Stratégies - SmartOrder PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 text-white min-h-screen">
    <div class="container mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold">⚙️ Configuration Stratégies</h1>
            <a href="/dashboard" class="px-4 py-2 bg-purple-600 rounded-lg hover:bg-purple-700">← Dashboard</a>
        </div>

        <!-- Grid Trading -->
        <div class="bg-gray-800 rounded-xl p-6 mb-6 border border-gray-700">
            <h2 class="text-2xl font-bold mb-4">📊 Grid Trading (Infinity)</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-2">Coin</label>
                    <input type="text" id="grid_coin" value="BTCUSDT" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Capital (USDT)</label>
                    <input type="number" id="grid_capital" value="1000" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Prix Min ($)</label>
                    <input type="number" id="grid_min" value="60000" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Prix Max ($)</label>
                    <input type="number" id="grid_max" value="80000" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Nombre de Grilles</label>
                    <input type="number" id="grid_count" value="20" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Profit par Grille (%)</label>
                    <input type="number" id="grid_profit" value="1.0" step="0.1" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
            </div>
            <div class="mt-4 flex gap-4">
                <button onclick="saveGridConfig()" class="px-6 py-2 bg-green-600 rounded-lg hover:bg-green-700">💾 Sauvegarder</button>
                <button onclick="backtestStrategy('grid')" class="px-6 py-2 bg-blue-600 rounded-lg hover:bg-blue-700">📈 Backtest</button>
                <button onclick="startStrategy('grid')" class="px-6 py-2 bg-purple-600 rounded-lg hover:bg-purple-700">▶️ Démarrer</button>
            </div>
        </div>

        <!-- DCA Strategy -->
        <div class="bg-gray-800 rounded-xl p-6 mb-6 border border-gray-700">
            <h2 class="text-2xl font-bold mb-4">💰 DCA Strategy (3Commas Style)</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-2">Coin</label>
                    <input type="text" id="dca_coin" value="ETHUSDT" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Base Order (USDT)</label>
                    <input type="number" id="dca_base" value="100" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Safety Orders</label>
                    <input type="number" id="dca_safety_count" value="5" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Multiplicateur (1x, 2x, 4x...)</label>
                    <input type="number" id="dca_multiplier" value="2" step="0.1" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Price Deviation (%)</label>
                    <input type="number" id="dca_deviation" value="2.5" step="0.1" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Take Profit (%)</label>
                    <input type="number" id="dca_tp" value="3.0" step="0.1" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
            </div>
            <div class="mt-4">
                <label class="flex items-center">
                    <input type="checkbox" id="dca_trailing" class="mr-2">
                    <span>Trailing Take-Profit (actif si +3%)</span>
                </label>
            </div>
            <div class="mt-4 flex gap-4">
                <button onclick="saveDCAConfig()" class="px-6 py-2 bg-green-600 rounded-lg hover:bg-green-700">💾 Sauvegarder</button>
                <button onclick="backtestStrategy('dca')" class="px-6 py-2 bg-blue-600 rounded-lg hover:bg-blue-700">📈 Backtest</button>
                <button onclick="startStrategy('dca')" class="px-6 py-2 bg-purple-600 rounded-lg hover:bg-purple-700">▶️ Démarrer</button>
            </div>
        </div>

        <!-- Scalping -->
        <div class="bg-gray-800 rounded-xl p-6 mb-6 border border-gray-700">
            <h2 class="text-2xl font-bold mb-4">⚡ Scalping Volatilité</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-2">Coin</label>
                    <input type="text" id="scalp_coin" value="SOLUSDT" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Timeframe</label>
                    <select id="scalp_timeframe" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                        <option value="1m">1 minute</option>
                        <option value="5m" selected>5 minutes</option>
                        <option value="15m">15 minutes</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm mb-2">Position Size (USDT)</label>
                    <input type="number" id="scalp_size" value="50" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Take Profit (%)</label>
                    <input type="number" id="scalp_tp" value="0.5" step="0.1" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Stop Loss (%)</label>
                    <input type="number" id="scalp_sl" value="0.3" step="0.1" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm mb-2">Max Trades/Day</label>
                    <input type="number" id="scalp_max_trades" value="20" class="w-full px-4 py-2 bg-gray-700 rounded-lg">
                </div>
            </div>
            <div class="mt-4 flex gap-4">
                <button onclick="saveScalpConfig()" class="px-6 py-2 bg-green-600 rounded-lg hover:bg-green-700">💾 Sauvegarder</button>
                <button onclick="backtestStrategy('scalp')" class="px-6 py-2 bg-blue-600 rounded-lg hover:bg-blue-700">📈 Backtest</button>
                <button onclick="startStrategy('scalp')" class="px-6 py-2 bg-purple-600 rounded-lg hover:bg-purple-700">▶️ Démarrer</button>
            </div>
        </div>

        <!-- Backtest Results -->
        <div id="backtestResults" class="bg-gray-800 rounded-xl p-6 border border-gray-700 hidden">
            <h2 class="text-2xl font-bold mb-4">📊 Résultats Backtest</h2>
            <div id="backtestContent" class="space-y-2">
                <div class="flex justify-between">
                    <span>Total Trades:</span>
                    <span id="bt_trades">-</span>
                </div>
                <div class="flex justify-between">
                    <span>Win Rate:</span>
                    <span id="bt_winrate" class="text-green-400">-</span>
                </div>
                <div class="flex justify-between">
                    <span>Total PnL:</span>
                    <span id="bt_pnl" class="text-green-400">-</span>
                </div>
                <div class="flex justify-between">
                    <span>Sharpe Ratio:</span>
                    <span id="bt_sharpe">-</span>
                </div>
                <div class="flex justify-between">
                    <span>Max Drawdown:</span>
                    <span id="bt_dd" class="text-red-400">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function saveGridConfig() {
            const config = {
                coin: document.getElementById('grid_coin').value,
                capital: parseFloat(document.getElementById('grid_capital').value),
                min_price: parseFloat(document.getElementById('grid_min').value),
                max_price: parseFloat(document.getElementById('grid_max').value),
                grid_count: parseInt(document.getElementById('grid_count').value),
                profit_per_grid: parseFloat(document.getElementById('grid_profit').value)
            };
            console.log('Grid Config:', config);
            alert('✅ Configuration Grid sauvegardée !');
        }

        function saveDCAConfig() {
            const config = {
                coin: document.getElementById('dca_coin').value,
                base_order: parseFloat(document.getElementById('dca_base').value),
                safety_orders: parseInt(document.getElementById('dca_safety_count').value),
                multiplier: parseFloat(document.getElementById('dca_multiplier').value),
                deviation: parseFloat(document.getElementById('dca_deviation').value),
                take_profit: parseFloat(document.getElementById('dca_tp').value),
                trailing: document.getElementById('dca_trailing').checked
            };
            console.log('DCA Config:', config);
            alert('✅ Configuration DCA sauvegardée !');
        }

        function saveScalpConfig() {
            const config = {
                coin: document.getElementById('scalp_coin').value,
                timeframe: document.getElementById('scalp_timeframe').value,
                position_size: parseFloat(document.getElementById('scalp_size').value),
                take_profit: parseFloat(document.getElementById('scalp_tp').value),
                stop_loss: parseFloat(document.getElementById('scalp_sl').value),
                max_trades: parseInt(document.getElementById('scalp_max_trades').value)
            };
            console.log('Scalp Config:', config);
            alert('✅ Configuration Scalping sauvegardée !');
        }

        async function backtestStrategy(strategy) {
            alert(`📈 Lancement backtest ${strategy}...\n\nCeci peut prendre quelques secondes.`);
            
            // Simuler résultats
            setTimeout(() => {
                document.getElementById('backtestResults').classList.remove('hidden');
                document.getElementById('bt_trades').textContent = '156';
                document.getElementById('bt_winrate').textContent = '68.5%';
                document.getElementById('bt_pnl').textContent = '+$1,234.56';
                document.getElementById('bt_sharpe').textContent = '1.82';
                document.getElementById('bt_dd').textContent = '-8.3%';
            }, 2000);
        }

        async function startStrategy(strategy) {
            if (confirm(`Démarrer la stratégie ${strategy} ?`)) {
                alert(`✅ Stratégie ${strategy} démarrée !\n\nVoir dashboard pour suivre.`);
            }
        }
    </script>
</body>
</html>
