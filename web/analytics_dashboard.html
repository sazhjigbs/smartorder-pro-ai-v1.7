<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartOrder PRO - Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(255,255,255,0.2);
        }

        .tab.active {
            background: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .chart-card h2 {
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .positive { color: #10b981; }
        .negative { color: #ef4444; }

        .controls {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls select {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
        }

        .controls button {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .chart-large {
            height: 400px !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 SmartOrder PRO - Analytics Dashboard</h1>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab active" onclick="switchTab('overview')">📈 Vue d'ensemble</button>
            <button class="tab" onclick="switchTab('performance')">💰 Performance</button>
            <button class="tab" onclick="switchTab('strategies')">⚙️ Stratégies</button>
            <button class="tab" onclick="switchTab('markets')">🌐 Marchés</button>
            <a href="/dashboard" style="margin-left: auto;">
                <button class="tab">← Retour Dashboard</button>
            </a>
        </div>

        <!-- Controls -->
        <div class="controls">
            <label>Période:</label>
            <select id="timeframe" onchange="updateCharts()">
                <option value="1h">1 Heure</option>
                <option value="24h" selected>24 Heures</option>
                <option value="7d">7 Jours</option>
                <option value="30d">30 Jours</option>
            </select>

            <label>Symbole:</label>
            <select id="symbol" onchange="updateCharts()">
                <option value="BTCUSDT">BTC/USDT</option>
                <option value="ETHUSDT">ETH/USDT</option>
                <option value="SOLUSDT">SOL/USDT</option>
                <option value="BNBUSDT">BNB/USDT</option>
            </select>

            <button onclick="refreshData()">🔄 Rafraîchir</button>
            <button onclick="exportData()">📥 Exporter</button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">PNL Total</div>
                <div class="stat-value positive" id="stat-pnl">+0.00 USDT</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value" id="stat-winrate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Trades Totaux</div>
                <div class="stat-value" id="stat-trades">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ROI</div>
                <div class="stat-value positive" id="stat-roi">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Sharpe Ratio</div>
                <div class="stat-value" id="stat-sharpe">0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Max Drawdown</div>
                <div class="stat-value negative" id="stat-drawdown">0%</div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid">
            <!-- PNL Evolution -->
            <div class="chart-card full-width">
                <h2>📈 Évolution PNL</h2>
                <div class="chart-container chart-large">
                    <canvas id="pnlChart"></canvas>
                </div>
            </div>

            <!-- Price Chart -->
            <div class="chart-card">
                <h2>💹 Prix en Temps Réel</h2>
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>

            <!-- Volume Chart -->
            <div class="chart-card">
                <h2>📊 Volume</h2>
                <div class="chart-container">
                    <canvas id="volumeChart"></canvas>
                </div>
            </div>

            <!-- Win/Loss Distribution -->
            <div class="chart-card">
                <h2>🎯 Distribution Gains/Pertes</h2>
                <div class="chart-container">
                    <canvas id="winLossChart"></canvas>
                </div>
            </div>

            <!-- Strategy Performance -->
            <div class="chart-card">
                <h2>⚙️ Performance Stratégies</h2>
                <div class="chart-container">
                    <canvas id="strategyChart"></canvas>
                </div>
            </div>

            <!-- Exchange Comparison -->
            <div class="chart-card">
                <h2>🌐 Comparaison Exchanges</h2>
                <div class="chart-container">
                    <canvas id="exchangeChart"></canvas>
                </div>
            </div>

            <!-- Trade Distribution -->
            <div class="chart-card">
                <h2>📊 Distribution Trades par Heure</h2>
                <div class="chart-container">
                    <canvas id="tradeDistChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let charts = {};

        // Initialize charts
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            loadData();
            setInterval(loadData, 30000); // Update every 30s
        });

        function initCharts() {
            // PNL Evolution Chart
            charts.pnl = new Chart(document.getElementById('pnlChart'), {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'PNL (USDT)',
                        data: [],
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, labels: { color: '#fff' } }
                    },
                    scales: {
                        y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });

            // Price Chart
            charts.price = new Chart(document.getElementById('priceChart'), {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Prix',
                        data: [],
                        borderColor: '#3b82f6',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });

            // Volume Chart
            charts.volume = new Chart(document.getElementById('volumeChart'), {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Volume',
                        data: [],
                        backgroundColor: 'rgba(59, 130, 246, 0.5)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });

            // Win/Loss Chart
            charts.winLoss = new Chart(document.getElementById('winLossChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Gains', 'Pertes'],
                    datasets: [{
                        data: [65, 35],
                        backgroundColor: ['#10b981', '#ef4444']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });

            // Strategy Performance Chart
            charts.strategy = new Chart(document.getElementById('strategyChart'), {
                type: 'bar',
                data: {
                    labels: ['Grid Trading', 'DCA', 'Scalping', 'Trend Following'],
                    datasets: [{
                        label: 'PNL',
                        data: [120, 95, -30, 180],
                        backgroundColor: [
                            '#10b981',
                            '#3b82f6',
                            '#ef4444',
                            '#f59e0b'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });

            // Exchange Comparison Chart
            charts.exchange = new Chart(document.getElementById('exchangeChart'), {
                type: 'radar',
                data: {
                    labels: ['Liquidité', 'Fees', 'Latence', 'Fiabilité', 'Support'],
                    datasets: [
                        {
                            label: 'Bybit',
                            data: [85, 90, 95, 88, 92],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.2)'
                        },
                        {
                            label: 'Binance',
                            data: [95, 85, 90, 95, 90],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.2)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        r: {
                            ticks: { color: '#fff', backdropColor: 'transparent' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    }
                }
            });

            // Trade Distribution Chart
            charts.tradeDist = new Chart(document.getElementById('tradeDistChart'), {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}h`),
                    datasets: [{
                        label: 'Nombre de trades',
                        data: Array.from({length: 24}, () => Math.floor(Math.random() * 10)),
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });
        }

        async function loadData() {
            try {
                // Load PNL data
                const pnlRes = await fetch(`${API_URL}/api/pnl`);
                const pnlData = await pnlRes.json();
                
                updateStats(pnlData);
                updatePNLChart(pnlData);
                
                // Load price data
                await updatePriceChart();
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function updateStats(pnlData) {
            document.getElementById('stat-pnl').textContent = 
                `${pnlData.total_pnl >= 0 ? '+' : ''}${pnlData.total_pnl.toFixed(2)} USDT`;
            document.getElementById('stat-pnl').className = 
                `stat-value ${pnlData.total_pnl >= 0 ? 'positive' : 'negative'}`;
            
            // Simulate other stats
            document.getElementById('stat-winrate').textContent = '68%';
            document.getElementById('stat-trades').textContent = '142';
            document.getElementById('stat-roi').textContent = '+12.5%';
            document.getElementById('stat-sharpe').textContent = '1.85';
            document.getElementById('stat-drawdown').textContent = '-5.2%';
        }

        function updatePNLChart(data) {
            // Simulate PNL history
            const now = new Date();
            const labels = [];
            const values = [];
            
            for (let i = 23; i >= 0; i--) {
                const time = new Date(now - i * 3600000);
                labels.push(time.getHours() + 'h');
                values.push(data.total_pnl * (0.5 + Math.random() * 0.5));
            }
            
            charts.pnl.data.labels = labels;
            charts.pnl.data.datasets[0].data = values;
            charts.pnl.update();
        }

        async function updatePriceChart() {
            const symbol = document.getElementById('symbol').value;
            
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=5m&limit=50`);
                const data = await res.json();
                
                const labels = data.map((k, i) => `${i * 5}m`);
                const prices = data.map(k => parseFloat(k[4]));
                const volumes = data.map(k => parseFloat(k[5]));
                
                charts.price.data.labels = labels;
                charts.price.data.datasets[0].data = prices;
                charts.price.update();
                
                charts.volume.data.labels = labels;
                charts.volume.data.datasets[0].data = volumes;
                charts.volume.update();
                
            } catch (error) {
                console.error('Error fetching price:', error);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            // Tab logic here
        }

        function updateCharts() {
            loadData();
        }

        function refreshData() {
            loadData();
        }

        function exportData() {
            alert('Export fonctionnalité à venir !');
        }
    </script>
</body>
</html>
