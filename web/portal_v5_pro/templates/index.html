<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SAFELOGIC SmartOrder PRO</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="dashboard">
    <h2>SAFELOGIC SmartOrder PRO — Unified Portal</h2>
    <div id="status-bar">
      CPU: <span id="cpu">--</span> •
      RAM: <span id="mem">--</span> •
      Exchange: <span id="exchange">--</span> •
      AutoMode: <span id="auto_mode">--</span> •
      Time: <span id="time">--</span>
    </div>

    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BYBIT:BTCUSDT.P&interval=15&theme=dark"
            width="100%" height="500px" frameborder="0"></iframe>
  </div>

  <script type="module">
  import ADMIN_TOKEN from "/static/admin_token.js";
  async function syncMetrics() {
    try {
      const res = await fetch("/api/unified", { headers: { "X-Admin-Token": ADMIN_TOKEN }});
      const data = await res.json();
      document.getElementById("cpu").innerText = data.cpu || "--";
      document.getElementById("mem").innerText = data.mem || "--";
      document.getElementById("exchange").innerText = data.exchange || "--";
      document.getElementById("auto_mode").innerText = data.auto_mode ? "ON" : "OFF";
      document.getElementById("time").innerText = data.timestamp || "--";
    } catch (err) {
      console.error("Erreur de synchro:", err);
    }
  }
  setInterval(syncMetrics, 3000);
  syncMetrics();
  </script>
</body>
</html>
