<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Analytics - SmartOrder PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.5s;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.5s ease-out;
        }

        .stat-card h3 {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .change {
            font-size: 14px;
        }

        .positive { color: #4ade80; }
        .negative { color: #f87171; }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.7s;
        }

        .chart-card h2 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .signature {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Performance Analytics</h1>
            <p>Real-time Trading Metrics & Visualization</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be populated here -->
        </div>

        <div class="charts-grid">
            <div class="chart-card full-width">
                <h2>📈 P&L Real-time (24h)</h2>
                <div class="chart-container">
                    <canvas id="pnlChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>🎯 Trade Distribution</h2>
                <div class="chart-container">
                    <canvas id="tradeDistChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>💰 Asset Distribution</h2>
                <div class="chart-container">
                    <canvas id="assetDistChart"></canvas>
                </div>
            </div>

            <div class="chart-card full-width">
                <h2>📉 Equity Curve (30 days)</h2>
                <div class="chart-container">
                    <canvas id="equityChart"></canvas>
                </div>
            </div>

            <div class="chart-card full-width">
                <h2>⏰ Performance by Hour</h2>
                <div class="chart-container">
                    <canvas id="hourlyChart"></canvas>
                </div>
            </div>

            <div class="chart-card full-width">
                <h2>📅 Monthly Summary (12 months)</h2>
                <div class="chart-container">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="signature">
            by MAIGA ABOUBACAR | SmartOrder PRO v6.0
        </div>
    </div>

    <script>
        // Get token from localStorage
        const token = localStorage.getItem('access_token');
        
        if (!token) {
            window.location.href = '/login';
        }

        const headers = {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };

        // Fetch and display stats
        async function loadStats() {
            try {
                const response = await fetch('/api/charts/performance-metrics', { headers });
                const data = await response.json();
                
                if (data.success) {
                    const stats = data.metrics;
                    const statsGrid = document.getElementById('statsGrid');
                    
                    statsGrid.innerHTML = `
                        <div class="stat-card">
                            <h3>Total Trades</h3>
                            <div class="value">${stats.total_trades}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Win Rate</h3>
                            <div class="value positive">${stats.win_rate}%</div>
                        </div>
                        <div class="stat-card">
                            <h3>Profit Factor</h3>
                            <div class="value positive">${stats.profit_factor}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Sharpe Ratio</h3>
                            <div class="value">${stats.sharpe_ratio}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Max Drawdown</h3>
                            <div class="value negative">${stats.max_drawdown}%</div>
                        </div>
                        <div class="stat-card">
                            <h3>Largest Win</h3>
                            <div class="value positive">$${stats.largest_win}</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // P&L Real-time Chart
        async function loadPnlChart() {
            const response = await fetch('/api/charts/pnl-realtime?hours=24', { headers });
            const data = await response.json();
            
            const ctx = document.getElementById('pnlChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.data.map(d => new Date(d.timestamp).toLocaleTimeString()),
                    datasets: [{
                        label: 'P&L',
                        data: data.data.map(d => d.cumulative_pnl),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // Trade Distribution Chart
        async function loadTradeDistChart() {
            const response = await fetch('/api/charts/trade-distribution', { headers });
            const data = await response.json();
            
            const ctx = document.getElementById('tradeDistChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Wins', 'Losses', 'Break Even'],
                    datasets: [{
                        data: [data.data.win_trades, data.data.loss_trades, data.data.break_even],
                        backgroundColor: ['#4ade80', '#f87171', '#94a3b8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // Asset Distribution Chart
        async function loadAssetDistChart() {
            const response = await fetch('/api/charts/asset-distribution', { headers });
            const data = await response.json();
            
            const ctx = document.getElementById('assetDistChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: data.data.map(d => d.asset),
                    datasets: [{
                        data: data.data.map(d => d.percentage),
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // Equity Curve Chart
        async function loadEquityChart() {
            const response = await fetch('/api/charts/equity-curve?days=30', { headers });
            const data = await response.json();
            
            const ctx = document.getElementById('equityChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.data.map(d => d.date),
                    datasets: [{
                        label: 'Equity',
                        data: data.data.map(d => d.equity),
                        borderColor: '#4ade80',
                        backgroundColor: 'rgba(74, 222, 128, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // Hourly Performance Chart
        async function loadHourlyChart() {
            const response = await fetch('/api/charts/hourly-performance', { headers });
            const data = await response.json();
            
            const ctx = document.getElementById('hourlyChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.data.map(d => d.hour),
                    datasets: [{
                        label: 'P&L by Hour',
                        data: data.data.map(d => d.pnl),
                        backgroundColor: data.data.map(d => d.pnl > 0 ? '#4ade80' : '#f87171')
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // Monthly Summary Chart
        async function loadMonthlyChart() {
            const response = await fetch('/api/charts/monthly-summary?months=12', { headers });
            const data = await response.json();
            
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.data.map(d => d.month),
                    datasets: [{
                        label: 'Monthly P&L',
                        data: data.data.map(d => d.pnl),
                        backgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // Load all charts
        async function loadAllCharts() {
            await loadStats();
            await loadPnlChart();
            await loadTradeDistChart();
            await loadAssetDistChart();
            await loadEquityChart();
            await loadHourlyChart();
            await loadMonthlyChart();
        }

        // Initialize
        loadAllCharts();

        // Auto-refresh every 30 seconds
        setInterval(loadAllCharts, 30000);
    </script>
</body>
</html>
