<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Trading Control - SmartOrder PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
        }
        
        .header h1 { font-size: 36px; margin-bottom: 10px; }
        
        .status-badge {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }
        
        .status-running { background: linear-gradient(135deg, #00ff88 0%, #00d9ff 100%); color: #000; }
        .status-stopped { background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%); }
        .status-paused { background: linear-gradient(135deg, #ffd93d 0%, #ffb347 100%); color: #000; }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .control-btn {
            padding: 30px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .control-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        
        .control-btn:active { transform: scale(0.95); }
        
        .btn-start {
            background: linear-gradient(135deg, #00ff88 0%, #00d9ff 100%);
            color: #000;
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
        }
        
        .btn-pause {
            background: linear-gradient(135deg, #ffd93d 0%, #ffb347 100%);
            color: #000;
        }
        
        .btn-emergency {
            background: linear-gradient(135deg, #d32f2f 0%, #f44336 100%);
            font-size: 22px;
            grid-column: span 2;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .override-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .override-panel h2 { margin-bottom: 20px; }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
        }
        
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #00d9ff;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            animation: slideIn 0.3s;
            z-index: 1000;
        }
        
        .notification.success { background: #00ff88; color: #000; }
        .notification.error { background: #ff6b6b; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Trading Control Panel</h1>
            <div class="status-badge" id="statusBadge">LOADING...</div>
        </div>
        
        <div class="controls-grid">
            <button class="control-btn btn-start" onclick="startTrading()">
                🚀 START TRADING
            </button>
            
            <button class="control-btn btn-stop" onclick="stopTrading()">
                🛑 STOP TRADING
            </button>
            
            <button class="control-btn btn-pause" onclick="pauseTrading()">
                ⏸️ PAUSE
            </button>
            
            <button class="control-btn btn-pause" onclick="resumeTrading()">
                ▶️ RESUME
            </button>
            
            <button class="control-btn btn-emergency" onclick="emergencyStop()">
                🚨 EMERGENCY STOP 🚨
            </button>
        </div>
        
        <div class="override-panel">
            <h2>🎯 Manual Override</h2>
            
            <div class="input-group">
                <label>Action</label>
                <select id="action">
                    <option value="buy">BUY</option>
                    <option value="sell">SELL</option>
                    <option value="close">CLOSE POSITION</option>
                    <option value="close_all">CLOSE ALL</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Symbol (e.g. BTCUSDT)</label>
                <input type="text" id="symbol" placeholder="BTCUSDT">
            </div>
            
            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="quantity" placeholder="0.001" step="0.001">
            </div>
            
            <div class="input-group">
                <label>Price (optional)</label>
                <input type="number" id="price" placeholder="Market price" step="0.01">
            </div>
            
            <button class="control-btn btn-start" onclick="executeOverride()">
                Execute Manual Order
            </button>
        </div>
    </div>
    
    <div class="notification" id="notification"></div>
    
    <script>
        const API_BASE = '';
        
        async function loadStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/control/status`);
                const data = await res.json();
                
                if (data.success) {
                    const status = data.status.status;
                    const badge = document.getElementById('statusBadge');
                    badge.textContent = status.toUpperCase();
                    badge.className = 'status-badge status-' + status;
                }
            } catch (e) {
                console.error('Error loading status:', e);
            }
        }
        
        async function startTrading() {
            if (!confirm('Start trading?')) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/control/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'auto' })
                });
                
                const data = await res.json();
                showNotification(data.message, data.success ? 'success' : 'error');
                loadStatus();
            } catch (e) {
                showNotification('Error: ' + e.message, 'error');
            }
        }
        
        async function stopTrading() {
            if (!confirm('Stop trading?')) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/control/stop`, {
                    method: 'POST'
                });
                
                const data = await res.json();
                showNotification(data.message, data.success ? 'success' : 'error');
                loadStatus();
            } catch (e) {
                showNotification('Error: ' + e.message, 'error');
            }
        }
        
        async function pauseTrading() {
            try {
                const res = await fetch(`${API_BASE}/api/control/pause`, {
                    method: 'POST'
                });
                
                const data = await res.json();
                showNotification(data.message, data.success ? 'success' : 'error');
                loadStatus();
            } catch (e) {
                showNotification('Error: ' + e.message, 'error');
            }
        }
        
        async function resumeTrading() {
            try {
                const res = await fetch(`${API_BASE}/api/control/resume`, {
                    method: 'POST'
                });
                
                const data = await res.json();
                showNotification(data.message, data.success ? 'success' : 'error');
                loadStatus();
            } catch (e) {
                showNotification('Error: ' + e.message, 'error');
            }
        }
        
        async function emergencyStop() {
            if (!confirm('⚠️ EMERGENCY STOP will close ALL positions! Continue?')) return;
            if (!confirm('Are you ABSOLUTELY SURE?')) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/control/emergency`, {
                    method: 'POST'
                });
                
                const data = await res.json();
                showNotification(data.message, 'error');
                loadStatus();
            } catch (e) {
                showNotification('Error: ' + e.message, 'error');
            }
        }
        
        async function executeOverride() {
            const action = document.getElementById('action').value;
            const symbol = document.getElementById('symbol').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const price = document.getElementById('price').value ? parseFloat(document.getElementById('price').value) : null;
            
            if (!symbol || !quantity) {
                showNotification('Please fill Symbol and Quantity', 'error');
                return;
            }
            
            if (!confirm(`Execute ${action.toUpperCase()} ${quantity} ${symbol}?`)) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/control/override`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, symbol, quantity, price })
                });
                
                const data = await res.json();
                showNotification(data.message, data.success ? 'success' : 'error');
            } catch (e) {
                showNotification('Error: ' + e.message, 'error');
            }
        }
        
        function showNotification(message, type) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = 'notification ' + type;
            notif.style.display = 'block';
            
            setTimeout(() => {
                notif.style.display = 'none';
            }, 5000);
        }
        
        // Load status on page load
        loadStatus();
        
        // Auto-refresh status every 5 seconds
        setInterval(loadStatus, 5000);
    </script>
</body>
</html>
