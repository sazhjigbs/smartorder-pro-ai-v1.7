<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SAFELOGIC SmartOrder PRO — Unified Portal</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">
<div class="flex flex-col min-h-screen">
<header class="bg-gray-800 p-4 shadow-lg flex justify-between items-center">
  <h1 class="text-2xl font-bold text-green-400">🧠 SAFELOGIC SmartOrder PRO v5 Portal</h1>
</header>
<main class="flex-1 p-6 grid grid-cols-2 gap-6">
  <div class="bg-gray-800 rounded-xl p-4 shadow-lg">
    <h2 class="text-xl mb-3">📊 Dashboard Global</h2>
    <iframe src="{{ api['Dashboard'] }}" class="w-full h-96 rounded-lg"></iframe>
  </div>
  <div class="bg-gray-800 rounded-xl p-4 shadow-lg">
    <h2 class="text-xl mb-3">🧩 WebSync Control (8091)</h2>
    <iframe src="{{ api['WebSync'] }}" class="w-full h-96 rounded-lg"></iframe>
  </div>
  <div class="bg-gray-800 rounded-xl p-4 shadow-lg col-span-2">
    <h2 class="text-xl mb-3">📡 System Telemetry (8181)</h2>
    <iframe src="{{ api['Telemetry'] }}" class="w-full h-80 rounded-lg"></iframe>
  </div>
  <div class="bg-gray-800 rounded-xl p-4 shadow-lg col-span-2">
    <h2 class="text-xl mb-3">🧠 API Live Status (8191)</h2>
    <pre class="bg-black text-green-400 rounded p-3 text-sm">{{ status | tojson(indent=2) }}</pre>
  </div>
</main>
<footer class="bg-gray-800 text-center py-3 text-gray-400">
  © 2025 SAFELOGIC SmartOrder PRO — Unified AI Portal v5
</footer>
</div>
</body>
</html>
